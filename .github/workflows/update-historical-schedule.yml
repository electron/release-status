name: Update Historical Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

permissions: {}

jobs:
  update_historical_schedule:
    name: Update Historical Schedule
    runs-on: ubuntu-latest
    environment:
      name: auto-updater
      deployment: false
    steps:
      - name: Generate GitHub App token (updater app)
        uses: electron/github-app-auth-action@5f70a3726af01b612f29aac96d05aa524389c9e9 # v2.1.0
        id: generate-token
        with:
          creds: ${{ secrets.GH_APP_CREDS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Add newly EOL majors
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const FILE = 'app/data/historical-schedule.json';
          const major = (entry) => parseInt(entry.version, 10);

          const response = await fetch('https://releases.electronjs.org/schedule.json');
          if (!response.ok) {
            throw new Error(`Failed to fetch schedule: ${response.status}`);
          }

          const historical = JSON.parse(await readFile(FILE, 'utf8'));
          const known = new Set(historical.map(major));

          // Only add new majors, existing entries are the source of truth
          for (const { status, ...entry } of await response.json()) {
            if (status === 'eol' && !known.has(major(entry))) {
              historical.push(entry);
            }
          }

          historical.sort((a, b) => major(a) - major(b));
          await writeFile(FILE, JSON.stringify(historical, null, 2) + '\n');
          EOF
          git add app/data/historical-schedule.json
      - name: Commit changes to historical schedule
        id: commit-changes
        uses: dsanders11/github-app-commit-action@2bbcd331016d8c950b05a24b56e7eb9cb50d545e # v2.1.0
        with:
          fail-on-no-changes: false
          message: 'chore: update historical release schedule'
          ref: "chore/update-historical-schedule-${{ hashFiles('app/data/historical-schedule.json') }}"
          token: ${{ steps.generate-token.outputs.token }}
      - name: Create pull request
        if: ${{ steps.commit-changes.outputs.sha }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: "chore/update-historical-schedule-${{ hashFiles('app/data/historical-schedule.json') }}"
        run: |
          gh pr create \
            --title "chore: update historical release schedule" \
            --body "Automated PR to add newly EOL majors to historical-schedule.json" \
            --head "$BRANCH" \
            --base main
