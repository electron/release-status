name: Update Historical Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

permissions: {}

jobs:
  update_historical_schedule:
    name: Update Historical Schedule
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Add newly EOL majors
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const FILE = 'app/data/historical-schedule.json';
          const major = (entry) => parseInt(entry.version, 10);

          const response = await fetch('https://releases.electronjs.org/schedule.json');
          if (!response.ok) {
            throw new Error(`Failed to fetch schedule: ${response.status}`);
          }

          const historical = JSON.parse(await readFile(FILE, 'utf8'));
          const known = new Set(historical.map(major));

          // Only add new majors, existing entries are the source of truth
          for (const { status, ...entry } of await response.json()) {
            if (status === 'eol' && !known.has(major(entry))) {
              historical.push(entry);
            }
          }

          historical.sort((a, b) => major(a) - major(b));
          await writeFile(FILE, JSON.stringify(historical, null, 2) + '\n');
          EOF
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update-historical-schedule
          TITLE: 'chore: update historical release schedule'
        run: |
          if git diff --quiet; then
            echo "No newly EOL majors"
            exit 0
          fi

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "$TITLE" --body 'Adds newly EOL majors from https://releases.electronjs.org/schedule.json to the historical schedule.'
          fi
