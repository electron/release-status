name: Release Calendar Events

on:
  workflow_dispatch:
    inputs:
      major:
        description: Electron major (e.g. 30)
        required: true
        type: string

permissions: {}

jobs:
  generate-calendar-events:
    name: Generate Calendar Events
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Generate calendar events
        env:
          MAJOR: ${{ github.event.inputs.major }}
        run: |
          node <<'EOF'
          import { writeFile } from 'node:fs/promises';

          const major = Number(process.env.MAJOR);
          if (!/^[1-9]\d*$/.test(process.env.MAJOR) || !Number.isSafeInteger(major)) {
            throw new Error(`Invalid Electron major: ${process.env.MAJOR}`);
          }

          const response = await fetch('https://releases.electronjs.org/schedule.json');
          if (!response.ok) {
            throw new Error(`Failed to fetch schedule: ${response.status}`);
          }

          const schedule = await response.json();
          const release = schedule.find(({ version }) => version === `${major}.0.0`);
          if (!release) {
            throw new Error(`No schedule found for Electron ${major}`);
          }

          const milestone = release.chromiumVersion;
          const betaDate = Temporal.PlainDate.from(release.betaDate);
          const stableDate = Temporal.PlainDate.from(release.stableDate);
          const nextRelease = schedule.find(({ version }) => version === `${major + 1}.0.0`);
          let alphaDate;
          if (nextRelease?.alphaDate) {
            alphaDate = Temporal.PlainDate.from(nextRelease.alphaDate);
          } else {
            // Match /schedule's estimate when the next alpha date is not available yet.
            console.warn(`::warning::No alpha date for Electron ${major + 1}; estimating two days after stable`);
            alphaDate = stableDate.add({ days: 2 });
          }

          const kickOffStableDate = stableDate.subtract({ days: 1 });
          const kickOffAlphaDate = alphaDate.subtract({ days: 1 });
          const stablePrepStart = kickOffStableDate.subtract({ weeks: 1 });

          const events = [['Subject', 'Start Date', 'End Date', 'All Day Event']];
          const addEvent = (subject, start, end = start) => {
            events.push([subject, start.toString(), end.toString(), 'True']);
          };

          addEvent(`${major}.0.0-beta.1 (M${milestone})`, betaDate);
          addEvent(`✨${major}.0.0 Stable✨ (M${milestone})`, stableDate);
          addEvent(`Action: Kick Off ${major}.0.0`, kickOffStableDate);
          addEvent(`Action: Kick Off ${major + 1}.0.0-alpha.1`, kickOffAlphaDate);
          addEvent(`${major + 1}.0.0-alpha.1`, alphaDate);
          addEvent('Stable Prep Week', stablePrepStart, stablePrepStart.add({ days: 5 }));
          addEvent('Action: Stable Prep Assignment', stableDate.subtract({ days: 13 }));

          await writeFile(`e${major}-calendar-events.csv`, events.map((row) => row.join(',')).join('\n'));
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Calendar Events E${{ github.event.inputs.major }}
          path: e${{ github.event.inputs.major }}-calendar-events.csv
          archive: false
